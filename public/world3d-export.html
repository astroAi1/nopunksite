<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NoPunks 3D Export</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: stretch;
      }

      model-viewer {
        width: 100vw;
        height: 100vh;
        display: block;
        background: #000;
        --poster-color: transparent;
        --progress-bar-color: transparent;
        --progress-mask: transparent;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="viewer"
      alt="No-Punk export render"
      interaction-prompt="none"
      reveal="auto"
      shadow-intensity="0"
      exposure="1"
      touch-action="pan-y"
    ></model-viewer>

    <script>
      const CAMERA_TARGET = '0m 0m 0m';
      const CAMERA_PHI = 74;
      const CAMERA_RADIUS = 108;
      const FIELD_OF_VIEW = '27deg';
      const ROTATION_PER_SECOND = '42deg';
      const viewer = document.getElementById('viewer');
      const exportState = {
        ready: false,
        error: '',
        tokenId: null,
      };

      window.addEventListener('error', (event) => {
        if (!exportState.error) {
          exportState.error = event?.error?.message || event?.message || 'Export page error';
        }
      });

      window.addEventListener('unhandledrejection', (event) => {
        if (!exportState.error) {
          exportState.error =
            event?.reason?.message || String(event?.reason || 'Unhandled export rejection');
        }
      });

      function waitForModelViewerReady(timeoutMs = 15000) {
        if (window.customElements && customElements.get('model-viewer')) {
          return Promise.resolve();
        }

        return Promise.race([
          customElements.whenDefined('model-viewer'),
          new Promise((_, reject) => {
            window.setTimeout(() => reject(new Error('model-viewer unavailable')), timeoutMs);
          }),
        ]);
      }

      function waitForAnimationFrames(count = 2) {
        return new Promise((resolve) => {
          let framesRemaining = Math.max(1, Number.parseInt(count, 10) || 1);

          const step = () => {
            framesRemaining -= 1;
            if (framesRemaining <= 0) {
              resolve();
              return;
            }
            window.requestAnimationFrame(step);
          };

          window.requestAnimationFrame(step);
        });
      }

      function applyCamera(thetaDeg = 32) {
        viewer.cameraTarget = CAMERA_TARGET;
        viewer.cameraOrbit = `${thetaDeg}deg ${CAMERA_PHI}deg ${CAMERA_RADIUS}%`;
        viewer.fieldOfView = FIELD_OF_VIEW;
        viewer.autoRotate = false;
        viewer.autoRotateDelay = 0;
        viewer.setAttribute('rotation-per-second', ROTATION_PER_SECOND);
      }

      function waitForViewerLoad(timeoutMs = 20000) {
        return new Promise((resolve, reject) => {
          if (viewer.loaded) {
            resolve();
            return;
          }

          const timeout = window.setTimeout(() => {
            cleanup();
            reject(new Error('3D model load timed out'));
          }, timeoutMs);

          const onLoad = () => {
            cleanup();
            resolve();
          };
          const onError = (event) => {
            cleanup();
            reject(new Error(event?.detail?.type || '3D model failed to load'));
          };
          const cleanup = () => {
            window.clearTimeout(timeout);
            viewer.removeEventListener('load', onLoad);
            viewer.removeEventListener('error', onError);
          };

          viewer.addEventListener('load', onLoad);
          viewer.addEventListener('error', onError);
        });
      }

      async function loadToken(tokenId) {
        exportState.ready = false;
        exportState.error = '';
        exportState.tokenId = tokenId;

        const safeTokenId = Number.parseInt(String(tokenId), 10);
        if (!Number.isInteger(safeTokenId) || safeTokenId < 0 || safeTokenId > 9999) {
          throw new Error('Invalid tokenId');
        }

        const posterUrl = `/transparent/${safeTokenId}.png`;
        const modelUrl = `/world3d-models/${safeTokenId}.glb`;

        await waitForModelViewerReady();

        viewer.poster = posterUrl;
        viewer.setAttribute('poster', posterUrl);
        applyCamera(32);

        if (viewer.getAttribute('src') !== modelUrl) {
          const loadPromise = waitForViewerLoad();
          viewer.setAttribute('src', modelUrl);
          viewer.src = modelUrl;
          await loadPromise;
        } else if (!viewer.loaded) {
          await waitForViewerLoad();
        }

        if (viewer.updateComplete && typeof viewer.updateComplete.then === 'function') {
          await viewer.updateComplete;
        }
        await waitForAnimationFrames(3);

        exportState.ready = true;
        return window.__nopunkExport.getState();
      }

      window.__nopunkExport = {
        async loadToken(tokenId) {
          return loadToken(tokenId);
        },

        async setFrame(frameIndex, frameCount) {
          const thetaDeg = 32 - ((360 * frameIndex) / frameCount);
          applyCamera(thetaDeg);
          if (viewer.updateComplete && typeof viewer.updateComplete.then === 'function') {
            await viewer.updateComplete;
          }
          await waitForAnimationFrames(2);
          return { thetaDeg };
        },

        getState() {
          return {
            ready: exportState.ready,
            error: exportState.error,
            tokenId: exportState.tokenId,
            loaded: Boolean(viewer.loaded),
          };
        },
      };

      const initialTokenId = new URLSearchParams(window.location.search).get('tokenId');
      if (/^\d+$/.test(String(initialTokenId || '').trim())) {
        loadToken(Number.parseInt(initialTokenId, 10)).catch((err) => {
          exportState.error = err?.message || String(err);
        });
      }
    </script>
  </body>
</html>
